<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/icon32.png" alt="">
  <div class="brand"><b>ARISTOCRAT</b><span>захват видео</span></div>
  <div id="app" class="app">…</div>
</header>
<main id="list"></main>
<div id="empty" class="empty" hidden>
  <p><b>Видео на странице пока не найдено.</b></p>
  <p>Запустите воспроизведение видео на сайте — расширение заметит поток и покажет его здесь.</p>
</div>
<footer>
  <button id="clear" class="ghost">Очистить список</button>
  <span id="status"></span>
</footer>
<template id="item">
  <article class="item">
    <div class="thumb"><img alt=""><span class="dur"></span></div>
    <div class="body">
      <div class="row"><span class="kind"></span><input class="title" spellcheck="false"></div>
      <div class="row">
        <select class="quality"></select>
        <span class="info"></span>
        <button class="go">Скачать</button>
      </div>
    </div>
  </article>
</template>
<script src="popup.js"></script>
</body>
</html>
