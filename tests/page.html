<!doctype html>
<html><head><meta charset="utf-8"><title>Тестовая страница с видео</title>
<meta property="og:image" content="thumb.jpg"></head>
<body style="font-family:sans-serif;background:#eee">
<h1>Тестовая страница с видео</h1>
<video src="test.mp4" controls autoplay muted width="640"></video>
<p id="s">Загрузка плейлиста…</p>

</script>
</body></html>
