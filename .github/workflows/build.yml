name: Сборка

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 7/8/10/11 (64-бит)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Qt 5.15.2 + MSVC: Qt WebEngine (встроенный браузер) есть только в сборке под MSVC.
      - name: Компилятор MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Установка Qt 5.15.2 (MSVC + WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtwebengine'
          cache: true

      - name: Сборка
        shell: pwsh
        run: |
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Сборка папки программы
        shell: pwsh
        run: |
          $out = "dist\Aristocrat Видеоконвертер"
          New-Item -ItemType Directory -Force -Path "$out\tools" | Out-Null
          Copy-Item build\AristocratVideoConverter.exe "$out\Aristocrat Видеоконвертер.exe"
          $qt = $env:QT_ROOT_DIR
          # Библиотеки Qt (включая WebEngine) и графика ANGLE
          $dlls = "Qt5Core","Qt5Gui","Qt5Widgets","Qt5Svg","Qt5Network","Qt5WebEngineCore","Qt5WebEngineWidgets",
                  "Qt5Quick","Qt5QuickWidgets","Qt5Qml","Qt5QmlModels","Qt5WebChannel","Qt5Positioning","Qt5PrintSupport",
                  "d3dcompiler_47","libEGL","libGLESv2","opengl32sw"
          foreach ($d in $dlls) { if (Test-Path "$qt\bin\$d.dll") { Copy-Item "$qt\bin\$d.dll" $out\ } }
          Copy-Item "$qt\bin\QtWebEngineProcess.exe" $out\
          foreach ($p in "platforms\qwindows","styles\qwindowsvistastyle","imageformats\qsvg","imageformats\qjpeg",
                         "imageformats\qico","imageformats\qgif","iconengines\qsvgicon","printsupport\windowsprintersupport") {
            if (Test-Path "$qt\plugins\$p.dll") {
              $dir = Split-Path $p -Parent
              New-Item -ItemType Directory -Force -Path "$out\$dir" | Out-Null
              Copy-Item "$qt\plugins\$p.dll" "$out\$dir\"
            }
          }
          Copy-Item -Recurse "$qt\resources" "$out\resources"
          New-Item -ItemType Directory -Force -Path "$out\translations" | Out-Null
          Copy-Item -Recurse "$qt\translations\qtwebengine_locales" "$out\translations\qtwebengine_locales"
          # Библиотеки времени выполнения Visual C++ (чтобы не ставить отдельный пакет)
          $crt = Get-ChildItem -Path $env:VCToolsRedistDir -Recurse -Directory -Filter "Microsoft.VC14*.CRT" |
                 Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -notmatch "onecore|debug|spectre" } | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $out\
          Write-Host "CRT: $($crt.FullName)"

          # FFmpeg: сборка "essentials" от gyan.dev совместима с Windows 7
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "$out\tools\"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "$out\tools\"
          $lic = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$out\tools\FFMPEG-LICENSE.txt" }

          # Real-ESRGAN (нейросетевой апскейл, нужен Vulkan)
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile esrgan.zip
          Expand-Archive esrgan.zip -DestinationPath "$out\tools\realesrgan"
          Remove-Item -Recurse -Force "$out\tools\realesrgan\*.jpg","$out\tools\realesrgan\*.png","$out\tools\realesrgan\*.mp4" -ErrorAction SilentlyContinue

          # yt-dlp (загрузка видео) и Deno (нужен yt-dlp для YouTube). Официальный yt-dlp.exe работает с Windows 8.
          New-Item -ItemType Directory -Force -Path "$out\tools\deno" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$out\tools\yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$out\tools\deno"

          Copy-Item README.md $out\
          Copy-Item THIRD_PARTY.md $out\

      - name: Проверка запуска и встроенного браузера (Windows)
        shell: pwsh
        run: |
          $out = "dist\Aristocrat Видеоконвертер"
          New-Item -ItemType Directory -Force -Path web | Out-Null
          & "$out\tools\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=25" -f lavfi -i "sine=frequency=330" -t 12 -c:v libx264 -c:a aac -shortest -f hls -hls_time 4 -hls_playlist_type vod web\index.m3u8
          & "$out\tools\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=25" -t 5 -c:v libx264 web\test.mp4
          Copy-Item tests\page.html web\
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--directory","web" -PassThru -WindowStyle Hidden
          $env:ARISTOCRAT_LANG = "ru"
          $app = Start-Process "$out\Aristocrat Видеоконвертер.exe" -ArgumentList "--demo-browser=http://127.0.0.1:8765/page.html" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { Write-Host "Программа завершилась, код $($app.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width * 0.6)), ([int]($b.Height * 0.6))
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 60L
          $small.Save("$PWD\win.jpg", $codec, $ep)
          Stop-Process -Id $app.Id -Force
          Stop-Process -Id $srv.Id -Force
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\win.jpg"))
          Write-Host "SCREENSHOT_BEGIN windows"
          for ($i = 0; $i -lt $b64.Length; $i += 8000) { Write-Host $b64.Substring($i, [Math]::Min(8000, $b64.Length - $i)) }
          Write-Host "SCREENSHOT_END"

      - uses: actions/upload-artifact@v4
        with:
          name: AristocratVideoConverter-Windows-x64
          path: dist/

      - name: Архив для выпуска
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "dist\Aristocrat Видеоконвертер" -DestinationPath AristocratVideoConverter-Windows-x64.zip

      - name: Выпуск
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AristocratVideoConverter-Windows-x64.zip

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev libqt5svg5-dev qtwebengine5-dev qt5-image-formats-plugins cmake g++ libfuse2 xz-utils unzip zip

      - name: Сборка
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR=$PWD/AppDir cmake --install build

      - name: Модули (FFmpeg, Real-ESRGAN)
        run: |
          mkdir -p AppDir/usr/bin/tools/realesrgan
          curl -fL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe AppDir/usr/bin/tools/
          cp ffmpeg-master-latest-linux64-gpl/LICENSE.txt AppDir/usr/bin/tools/FFMPEG-LICENSE.txt || true
          curl -L -o esrgan.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip -q esrgan.zip -d AppDir/usr/bin/tools/realesrgan
          rm -f AppDir/usr/bin/tools/realesrgan/*.jpg AppDir/usr/bin/tools/realesrgan/*.png AppDir/usr/bin/tools/realesrgan/*.mp4
          curl -L -o AppDir/usr/bin/tools/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          mkdir -p AppDir/usr/bin/tools/deno
          curl -L -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -q deno.zip -d AppDir/usr/bin/tools/deno
          chmod +x AppDir/usr/bin/tools/ffmpeg AppDir/usr/bin/tools/ffprobe AppDir/usr/bin/tools/realesrgan/realesrgan-ncnn-vulkan \
                   AppDir/usr/bin/tools/yt-dlp AppDir/usr/bin/tools/deno/deno

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          EXTRA_QT_PLUGINS: svg
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            -d AppDir/usr/share/applications/aristocrat-video-converter.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/aristocrat-video-converter.png
          mv Aristocrat*.AppImage "Aristocrat Видеоконвертер-x86_64.AppImage"

      - name: Проверка запуска (скриншот в журнал)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils > /dev/null
          T=AppDir/usr/bin/tools
          $T/ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=720x576:rate=25" -f lavfi -i "sine=frequency=440" \
            -t 8 -vf "interlace" -c:v libx264 -flags +ilme+ildct -c:a aac -shortest "$PWD/Кассета 1994.mp4"
          shot() {   # $1 — имя, остальное — аргументы программы
            name=$1; shift
            xvfb-run -a -s "-screen 0 1600x960x24" bash -c '
              "./Aristocrat Видеоконвертер-x86_64.AppImage" "$@" & APP=$!
              sleep 14
              if ! kill -0 $APP 2>/dev/null; then echo "Программа завершилась при запуске"; exit 1; fi
              import -window root shot.png
              kill $APP
            ' _ "$@"
            convert shot.png -resize 1100x -quality 60 "$name.jpg"
            echo "SCREENSHOT_BEGIN $name"; base64 -w 8000 "$name.jpg"; echo "SCREENSHOT_END"
          }
          shot trim --demo-trim "$PWD/Кассета 1994.mp4"
          shot convert "$PWD/Кассета 1994.mp4"
          shot download --page=1
          ARISTOCRAT_LANG=ru shot settings --demo-settings=0
          ARISTOCRAT_LANG=ru ARISTOCRAT_THEME=light shot light "$PWD/Кассета 1994.mp4"
          ARISTOCRAT_LANG=ru ARISTOCRAT_THEME=turquoise shot turquoise --demo-settings=2
          ARISTOCRAT_LANG=ru ARISTOCRAT_THEME=ruby shot ruby "$PWD/Кассета 1994.mp4"

      - name: Проверка связи с расширением браузера
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARISTOCRAT_LANG: ru
        run: |
          T=AppDir/usr/bin/tools
          mkdir -p hls
          $T/ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=25" -f lavfi -i "sine=frequency=330" \
            -t 20 -c:v libx264 -c:a aac -shortest -f hls -hls_time 4 -hls_playlist_type vod hls/index.m3u8
          (cd hls && python3 -m http.server 8765 >/dev/null 2>&1 &)
          xvfb-run -a -s "-screen 0 1600x960x24" bash -c '
            "./Aristocrat Видеоконвертер-x86_64.AppImage" --page=1 & APP=$!
            sleep 8
            echo "Запрос от сайта (должен быть 403):"
            curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Origin: https://example.com" -H "Content-Type: application/json" \
              -d "{\"url\":\"http://127.0.0.1:8765/index.m3u8\"}" http://127.0.0.1:47615/add
            echo "Запрос от расширения:"
            curl -s -X POST -H "Origin: chrome-extension://test" -H "Content-Type: application/json" \
              -d "{\"url\":\"http://127.0.0.1:8765/index.m3u8\",\"kind\":\"HLS\",\"title\":\"Проверка захвата\",\"height\":0,\"headers\":{\"Referer\":\"http://127.0.0.1:8765/\"},\"pageUrl\":\"http://127.0.0.1:8765/page.html\"}" \
              http://127.0.0.1:47615/add; echo
            sleep 25
            import -window root shot.png
            kill $APP
          '
          ls -la "$HOME/Downloads/Aristocrat Видеоконвертер/" || true
          convert shot.png -resize 1100x -quality 60 extension.jpg
          echo "SCREENSHOT_BEGIN extension"; base64 -w 8000 extension.jpg; echo "SCREENSHOT_END"

      - name: Проверка встроенного браузера (Linux)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARISTOCRAT_LANG: ru
        run: |
          T=AppDir/usr/bin/tools
          $T/ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=25" -t 5 -c:v libx264 hls/test.mp4
          cp tests/page.html hls/
          (cd hls && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 1
          xvfb-run -a -s "-screen 0 1600x960x24" bash -c '
            "./Aristocrat Видеоконвертер-x86_64.AppImage" --demo-browser=http://127.0.0.1:8765/page.html > app.log 2>&1 & APP=$!
            sleep 25
            import -window root shot.png
            kill $APP
          '
          grep SNIFFED app.log || (echo "Видео не найдено"; tail -30 app.log)
          convert shot.png -resize 1100x -quality 60 browser.jpg
          echo "SCREENSHOT_BEGIN browser"; base64 -w 8000 browser.jpg; echo "SCREENSHOT_END"

      - name: Расширение для браузера (архивы)
        run: |
          for v in chromium firefox; do
            mkdir -p ext-$v/icons
            cp browser-extension/background.js browser-extension/popup.* ext-$v/
            cp browser-extension/icons/*.png ext-$v/icons/
          done
          cp browser-extension/manifest.json ext-chromium/manifest.json
          cp browser-extension/manifest.firefox.json ext-firefox/manifest.json
          (cd ext-chromium && zip -qr ../Aristocrat-extension-Chrome-Yandex.zip .)
          (cd ext-firefox && zip -qr ../Aristocrat-extension-Firefox.xpi .)

      - uses: actions/upload-artifact@v4
        with:
          name: Aristocrat-browser-extension
          path: |
            Aristocrat-extension-Chrome-Yandex.zip
            Aristocrat-extension-Firefox.xpi

      - uses: actions/upload-artifact@v4
        with:
          name: AristocratVideoConverter-Linux-x86_64
          path: "Aristocrat Видеоконвертер-x86_64.AppImage"

      - name: Выпуск
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Aristocrat Видеоконвертер-x86_64.AppImage"
